send:
  name: Отправить уведомление
  description: Отправить уведомление через Notify Universal
  fields:
    title:
      name: Заголовок
      description: Заголовок уведомления
      required: true
      example: "🏠 Статус дома"
      selector:
        text:

    message:
      name: Сообщение
      description: Текст уведомления
      required: true
      example: "Все устройства доступны"
      selector:
        text:
          multiline: true

    parse_mode:
      name: Режим форматирования
      description: Режим форматирования сообщения
      required: false
      default: html
      selector:
        select:
          options:
            - html
            - markdown

    telegram_keyboard:
      name: Клавиатура Telegram
      description: Inline-кнопки Telegram
      required: false
      default: ""
      selector:
        text:

    vk_keyboard:
      name: Клавиатура VK
      description: Inline-кнопки VK
      required: false
      selector:
        object:
